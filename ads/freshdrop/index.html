<main id="main"><style>@font-face{font-family:Fredoka;src:url(../../assets/fonts/fredoka-latin.woff2) format("woff2");font-weight:500 700;font-display:swap}

<div class="top"><div><p class="kicker">FreshDrop · 10 example ads · 1080×1080</p><h1>FreshDrop ads</h1><p>Original layouts, each inspired by the general style trend of a design resource site. Product photos from <a href="https://amireven-crypto.github.io/freshdrop/">FreshDrop</a>.</p></div><a class="btn ghost" href="../../">Back to hub</a></div>
