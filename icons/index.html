<body><a class="skip" href="#main">Skip to content</a><div class="app"><nav id="rail" class="rail" aria-label="Sections"></nav>
<main id="main"><style>.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.ig button{background:var(--card);border:0;border-radius:22px;padding:18px 6px;color:var(--text);cursor:pointer;display:grid;justify-items:center;gap:10px;font:600 .75rem var(--font)}.ig button:hover{background:var(--accent);color:var(--on-accent)}.ig svg{width:30px;height:30px}</style>
<div class="top"><div><p class="kicker">Original line icons · 24×24</p><h1>Icons</h1><p>Click an icon to copy its SVG.</p></div><div class="pills"><button class="btn primary" id="dl" type="button">Download sprite.svg</button><a class="btn ghost" href="../">Back to hub</a></div></div>
<div class="card" style="margin-bottom:14px"><label for="q">Search icons</label><input id="q" type="text" placeholder="e.g. mail"></div><p id="cnt" aria-live="polite"></p><div class="ig" id="ig"></div></main></div>
<script src="../assets/icons.js"></script><script src="../assets/common.js?v=20261118-a11y"></script><script>(function(){var ig=document.getElementById('ig'),q=document.getElementById('q');
function svg(n){return '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+DS_ICONS[n]+'</svg>'}
function render(){var k=q.value.toLowerCase().trim(),ns=Object.keys(DS_ICONS).filter(function(n){return n.toLowerCase().indexOf(k)>-1});
ig.innerHTML=ns.map(function(n){return '<button type="button" data-n="'+n+'" aria-label="Copy '+n+' icon">'+dsIcon(n)+'<span>'+n+'</span></button>'}).join('');document.getElementById('cnt').textContent=ns.length+' icons';}
q.addEventListener('input',render);ig.addEventListener('click',function(e){var b=e.target.closest('button');if(b)dsCopy(svg(b.dataset.n),b.dataset.n+' SVG copied')});
document.getElementById('dl').addEventListener('click',function(){var s='<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n'+Object.keys(DS_ICONS).map(function(n){return '<symbol id="i-'+n+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+DS_ICONS[n]+'</symbol>'}).join('\n')+'\n</svg>\n';
var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));a.download='sprite.svg';document.body.appendChild(a);a.click();a.remove();dsToast('sprite.svg downloaded')});render();})()</script></body></html>
